services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_v2
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "5432:5432"
    volumes:
      - erp-v2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_v2"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  erp-v2-postgres:
