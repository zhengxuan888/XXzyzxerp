services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.test-server
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@postgres:5432/erp_v2?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - ./data/storage:/app/.local-storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - erp-internal

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env.test-server
    environment:
      DATABASE_URL: postgresql://erp:${POSTGRES_PASSWORD}@postgres:5432/erp_v2?schema=public
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - erp-internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_v2
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_v2"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - erp-internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      - erp-internal

volumes:
  postgres-data:
  redis-data:

networks:
  erp-internal:
    driver: bridge
